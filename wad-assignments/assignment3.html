<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Navbar Styling</title>
<style>
nav a{color:inherit}
/* 1: royal blue background */
.n1{background:royalblue;padding:40px}
/* 2: single horizontal row */
.n2{background:royalblue}
.n2 ul{display:flex}
/* 3: remove dots */
.n3{background:royalblue}
.n3 ul{display:flex;list-style:none;padding:0;margin:0}
/* 4: white links */
.n4{background:midnightblue}
.n4 ul{display:flex;list-style:none;padding:0;margin:0}
.n4 a{color:white}
/* 5: spacing */
.n5{background:midnightblue;padding:10px}
.n5 ul{display:flex;gap:15px;list-style:none;margin:0;padding:0}
.n5 a{color:white}
/* 6: rgb(174,5,168) */
.n6{background-color:rgb(174,5,168);padding:10px}
.n6 ul{display:flex;gap:15px;list-style:none;margin:0;padding:0}
.n6 a{color:white}
